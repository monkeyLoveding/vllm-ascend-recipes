meta:
  title: "Qwen3-235B-A22B"
  slug: "qwen3-235b-a22b"
  provider: "Qwen"
  description: "The largest MoE variant of the Qwen3 series with 235B total parameters and 22B activated per token. Breakthrough advancements in reasoning, instruction-following, agent capabilities, and multilingual support."
  title_zh: "Qwen3-235B-A22B"
  description_zh: "Qwen3 系列最大的 MoE 模型，235B 总参数，22B 激活参数。在推理、指令遵循、智能体能力和多语言支持方面取得突破性进展。"
  date_added: 2026-07-01
  date_updated: 2026-07-01
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Verified on Atlas 800 A3 (128G × 8) nodes with W8A8 precision"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: unsupported

model:
  model_id: "Qwen/Qwen3-235B-A22B"
  min_vllm_version: "0.8.4rc2"
  architecture: moe
  parameter_count: "235B"
  active_parameters: "22B"
  context_length: 131072
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
    - "--gpu-memory-utilization"
    - "0.95"
  base_env:
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"

features:
  quantization_ascend:
    description: "Enable Ascend W8A8 quantization (remove for BF16 weights)."
    label: "Ascend Quant"
    args:
      - "--quantization"
      - "ascend"
  async_scheduling:
    description: "Enable asynchronous scheduling to overlap CPU scheduling with NPU computation."
    label: "Async Scheduling"
    args:
      - "--async-scheduling"
  spec_decoding:
    description: "Enable Eagle3 speculative decoding for improved throughput."
    label: "Eagle3"
    args:
      - "--speculative-config"
      - '{"method": "eagle3", "model": "your_eagle3_model_path", "num_speculative_tokens": 3}'
  yarn_rope:
    description: "Enable YaRN rope-scaling for extended context beyond 40K (required for long-context scenarios)."
    label: "YaRN RoPE"
    args:
      - "--hf-overrides"
      - '{"rope_parameters": {"rope_type": "yarn", "rope_theta": 1000000, "factor": 4, "original_max_position_embeddings": 32768}}'
  flashcomm1:
    description: "Enable FlashComm communication optimization."
    label: "FlashComm1"
    args:
      - "--additional-config"
      - '{"enable_flashcomm1": true}'
  fused_mc2:
    description: "Enable fused MoE operators. Value 1 for typical EP, 2 for large-scale EP (PD disaggregation)."
    label: "Fused MC2"
    args:
      - "--additional-config"
      - '{"enable_fused_mc2": 1}'
  cpu_binding:
    description: "Enable CPU core binding for reduced NUMA latencies."
    label: "CPU Binding"
    args:
      - "--additional-config"
      - '{"enable_cpu_binding": true}'

opt_in_features:
  - spec_decoding
  - yarn_rope
  - flashcomm1
  - fused_mc2
  - cpu_binding

variants:
  default:
    precision: w8a8
    vram_minimum_gb: 64
    description: "W8A8 quantized weights on Atlas 800 A3 (recommended)"
    extra_args:
      - "--quantization"
      - "ascend"
    extra_env: {}
  bf16:
    precision: bf16
    vram_minimum_gb: 128
    description: "BF16 weights on Atlas 800 A3 (2 nodes recommended)"
    extra_args: []
    extra_env: {}

compatible_strategies:
  - single_node_tp
  - multi_node_pd_disaggregation
  - single_node_pd_hybrid

hardware_overrides:
  ascend_a3:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "1024"
      LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD"
  ascend_a2:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_OP_EXPANSION_MODE: "AIV"

guide: |
  ## Overview

  Qwen3-235B-A22B is the largest MoE variant of the Qwen3 series, featuring 235B total parameters with 22B activated per token. It delivers breakthrough advancements in reasoning, instruction-following, agent capabilities, and multilingual support.

  First supported in vLLM-Ascend v0.8.4rc2. This guide is validated on **vLLM-Ascend v0.21.0**. All v0.21.0 and later versions can run stably.

  ## Prerequisites

  - **Hardware**: 1-2 Atlas 800I A3 (64G × 16) nodes for W8A8; 2+ nodes for BF16
  - **Model weights**: [ModelScope (BF16)](https://www.modelscope.cn/models/Qwen/Qwen3-235B-A22B) or [Modelers (W8A8)](https://modelers.cn/models/Modelers_Park/Qwen3-235B-A22B-w8a8)

  ### Environment Setup

  **Docker (recommended):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  **Pip install:**
  ```bash
  git clone https://github.com/vllm-project/vllm.git
  cd vllm && pip install -e .
  git clone https://github.com/vllm-project/vllm-ascend.git
  cd vllm-ascend && pip install -e .
  ```

  ## Quantization

  W8A8 pre-quantized weights are available from Modelers. To quantize BF16 yourself, use **msmodelslim**:
  ```bash
  git clone https://gitcode.com/Ascend/msmodelslim.git
  cd msmodelslim && bash install.sh
  cd example/Qwen3-MOE
  python3 quant_qwen_moe_w8a8.py --model_path /path/to/Qwen3-235B-A22B \
      --save_path /path/to/Qwen3-235B-A22B-W8A8-rot \
      --anti_dataset ../common/qwen3-moe_anti_prompt_50.json \
      --calib_dataset ../common/qwen3-moe_calib_prompt_50.json \
      --trust_remote_code True --rot
  ```

  ## Service Verification

  After starting the service, verify with:
  ```bash
  curl http://<node0_ip>:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3",
          "prompt": "The future of AI is",
          "max_completion_tokens": 50,
          "temperature": 0
      }'
  ```

  ## Recommended Configurations

  | Scenario       | NPUs     | TP | DP | max-model-len | MTP  | Notes |
  | -------------- | -------- | -- | -- | ------------- | ---- | ----- |
  | High Throughput | 16 (A3)  | 4  | 4  | 32768         | none | Single-node TP4+DP4 |
  | Low Latency    | 16 (A3)  | 16 | 1  | 32768         | 3    | Eagle3 spec decoding |
  | Long Context   | 16 (A3)  | 8  | 1  | 135000        | none | TP8+CP2 with YaRN |
  | PD Separation  | 48 (3×A3)| 8(P)/4(D) | 2(P)/8(D) | 40960 | - | 1P+2D via Mooncake |

  ## Troubleshooting

  Refer to [Performance Tuning Guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) and [FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html).

  ## References

  - [vllm-ascend Documentation](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-235B-A22B.html)
  - [ModelScope (BF16)](https://www.modelscope.cn/models/Qwen/Qwen3-235B-A22B)
  - [Modelers (W8A8)](https://modelers.cn/models/Modelers_Park/Qwen3-235B-A22B-w8a8)
  - [PD Disaggregation Guide (Mooncake)](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)

guide_zh: |
  ## 概述

  Qwen3-235B-A22B 是 Qwen3 系列最大的 MoE 模型，拥有 235B 总参数和 22B 激活参数。在推理、指令遵循、智能体能力和多语言支持方面取得了突破性进展。

  首次支持于 vLLM-Ascend v0.8.4rc2。本文档基于 **vLLM-Ascend v0.21.0** 验证编写，所有 v0.21.0 及之后版本均可稳定运行。

  ## 环境准备

  - **硬件**: W8A8 需 1-2 台 Atlas 800I A3 (64G × 16)；BF16 需 2+ 台
  - **模型权重**: [ModelScope (BF16)](https://www.modelscope.cn/models/Qwen/Qwen3-235B-A22B) 或 [魔乐社区 (W8A8)](https://modelers.cn/models/Modelers_Park/Qwen3-235B-A22B-w8a8)

  ### 环境搭建

  **Docker (推荐):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  **Pip 安装:**
  ```bash
  git clone https://github.com/vllm-project/vllm.git
  cd vllm && pip install -e .
  git clone https://github.com/vllm-project/vllm-ascend.git
  cd vllm-ascend && pip install -e .
  ```

  ## 量化方案

  魔乐社区提供 W8A8 预量化权重。如需自行量化 BF16 权重，使用 **msmodelslim** 工具（见英文版量化章节）。

  ## 服务验证

  ```bash
  curl http://<node0_ip>:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3",
          "prompt": "人工智能的未来是",
          "max_completion_tokens": 50,
          "temperature": 0
      }'
  ```

  ## 推荐配置

  | 场景       | NPU 数量  | TP | DP | max-model-len | MTP  | 备注 |
  | ---------- | --------- | -- | -- | ------------- | ---- | ---- |
  | 高吞吐     | 16 (A3)   | 4  | 4  | 32768         | 无   | 单节点 TP4+DP4 |
  | 低延迟     | 16 (A3)   | 16 | 1  | 32768         | 3    | Eagle3 投机解码 |
  | 长上下文   | 16 (A3)   | 8  | 1  | 135000        | 无   | TP8+CP2 + YaRN |
  | PD 分离    | 48 (3×A3) | 8(P)/4(D) | 2(P)/8(D) | 40960 | - | 1P+2D Mooncake |

  ## 故障排除

  参考 [性能调优指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) 和 [常见问题](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

  ## 参考

  - [vllm-ascend 文档](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-235B-A22B.html)
  - [ModelScope (BF16)](https://www.modelscope.cn/models/Qwen/Qwen3-235B-A22B)
  - [魔乐社区 (W8A8)](https://modelers.cn/models/Modelers_Park/Qwen3-235B-A22B-w8a8)
  - [PD 分离部署指南 (Mooncake)](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)
