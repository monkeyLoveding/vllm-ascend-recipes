meta:
  title: "GLM-5.2"
  slug: "glm-5.2"
  provider: "THUDM"
  description: "GLM-5.2 is a Mixture-of-Experts (MoE) model from Zhipu AI with 753B total parameters, targeting complex systems engineering and long-horizon agentic tasks. Supports MTP speculative decoding with up to 5 speculative tokens, async scheduling, and PD disaggregation on Ascend NPUs."
  title_zh: "GLM-5.2"
  description_zh: "GLM-5.2 是智谱 AI 的混合专家 (MoE) 模型，拥有 753B 总参数，面向复杂系统工程和长周期智能体任务。支持最多 5 个投机 token 的 MTP 投机解码、异步调度和 PD 分离部署。"
  date_added: 2026-07-13
  date_updated: 2026-07-13
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Multi-node deployment on Atlas 800 A2/A3 with W8A8 and W4A8C8 precision"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "zai-org/GLM-5.2"
  min_vllm_version: "0.22.1rc"
  architecture: moe
  parameter_count: "753B"
  context_length: 131072
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
    - "--gpu-memory-utilization"
    - "0.95"
    - "--seed"
    - "1024"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    HCCL_BUFFSIZE: "200"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_ASCEND_BALANCE_SCHEDULING: "1"

features:
  quantization_ascend:
    description: "Enable Ascend W8A8 quantization (remove for BF16 or change for W4A8C8)."
    label: "Ascend Quant"
    args:
      - "--quantization"
      - "ascend"
  mtp_spec_decoding:
    description: "Enable MTP (Multi-Token Prediction) speculative decoding with up to 5 tokens."
    label: "MTP Spec Decoding"
    args:
      - "--speculative-config"
      - '{"num_speculative_tokens": 5, "method": "deepseek_mtp"}'
  async_scheduling:
    description: "Enable asynchronous scheduling to overlap CPU scheduling with NPU computation."
    label: "Async Scheduling"
    args:
      - "--async-scheduling"
  flashcomm1:
    description: "Enable FlashComm communication optimization (disable for long-sequence >=16k with low concurrency <=8)."
    label: "FlashComm1"
    args: []
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  mlapo:
    description: "Enable MLAPO optimization (required for W8A8 quantized models)."
    label: "MLAPO"
    args: []
    env:
      VLLM_ASCEND_ENABLE_MLAPO: "1"
  multistream_overlap:
    description: "Enable multi-stream overlap for MoE shared expert computation."
    label: "Multi-stream Overlap"
    args:
      - "--additional-config"
      - '{"multistream_overlap_shared_expert": true}'
  tool_calling:
    description: "Enable GLM-5.2 function calling with tool parser and reasoning parser."
    label: "Tool Calling"
    args:
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--enable-auto-tool-choice"
  prefix_caching:
    description: "Enable automatic KV-cache prefix caching."
    label: "Prefix Caching"
    args:
      - "--enable-prefix-caching"

opt_in_features:
  - mtp_spec_decoding
  - async_scheduling
  - flashcomm1
  - mlapo
  - multistream_overlap
  - tool_calling
  - prefix_caching

variants:
  default:
    precision: w8a8
    vram_minimum_gb: 128
    description: "W8A8 quantized weights on Atlas 800 A2/A3 (recommended)"
    extra_args:
      - "--quantization"
      - "ascend"
    extra_env:
      VLLM_ASCEND_ENABLE_MLAPO: "1"
  bf16:
    precision: bf16
    vram_minimum_gb: 256
    description: "BF16 weights (requires 2+ A3 or 4+ A2 nodes)"
    extra_args: []
    extra_env: {}
  w4a8c8:
    precision: w4a8c8
    vram_minimum_gb: 64
    description: "W4A8C8 ultra-low precision for maximum context length (250K-1M)"
    extra_args:
      - "--quantization"
      - "ascend"
    extra_env:
      VLLM_ASCEND_ENABLE_MLAPO: "1"

compatible_strategies:
  - single_node_tp
  - multi_node_tp
  - multi_node_pd_disaggregation

hardware_overrides:
  ascend_a3:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_BUFFSIZE: "200"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  ascend_a2:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--block-size"
      - "128"
      - "--safetensors-load-strategy"
      - "prefetch"
    extra_env:
      HCCL_BUFFSIZE: "200"
      OMP_NUM_THREADS: "10"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

guide: |
  ## Overview

  GLM-5.2 is a Mixture-of-Experts (MoE) model from Zhipu AI (THUDM) with 753B total parameters, targeting complex systems engineering and long-horizon agentic tasks. It supports Multi-Token Prediction (MTP) speculative decoding with up to 5 speculative tokens, async scheduling, dynamic EPLB, and Prefill-Decode disaggregation on Ascend NPUs.

  This guide is validated on **vLLM-Ascend v0.22.1rc**. All v0.22.1rc and later versions can run stably.

  ## Prerequisites

  - **Hardware**:
    - W8A8: 1 × Atlas 800I A3 or 2 × Atlas 800I A2
    - BF16: 2 × Atlas 800I A3 or 4 × Atlas 800I A2
    - W4A8C8: 1 × Atlas 800I A3 or 1 × Atlas 800I A2
  - **Model weights**:
    - BF16: [ModelScope](https://www.modelscope.cn/models/ZhipuAI/GLM-5.2) / [HuggingFace](https://huggingface.co/zai-org/GLM-5.2)
    - W8A8: [ModelScope](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8)

  ### Environment Setup

  **Docker (recommended):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  **Pip install:**
  ```bash
  git clone https://github.com/vllm-project/vllm.git
  cd vllm && pip install -e .
  git clone https://github.com/vllm-project/vllm-ascend.git
  cd vllm-ascend && pip install -e .
  ```

  ## Tuning Notes

  - For single-node low-latency scenarios, recommend `dp1 tp16` with expert parallel disabled.
  - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` should be disabled for long-sequence (>=16k) and low-concurrency (<=8 batch size).
  - `VLLM_ASCEND_ENABLE_MLAPO=1` is required for W8A8 quantized models on the decode side.
  - `DYNAMIC_EPLB=1` enables dynamic expert parallel load balancing on decode nodes.
  - For 200k context window, use co-located 4-node configuration with dp4 tp8.

  ## Service Verification

  ```bash
  curl http://localhost:8000/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "glm-52",
          "prompt": "Give me a short introduction to large language models.",
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  ## Recommended Configurations

  | Scenario               | Deployment   | Device | NPUs | Config         | max-model-len |
  | ---------------------- | ------------ | ------ | ---- | -------------- | ------------- |
  | High Throughput        | Single-Node  | A3     | 16   | dp2 tp8        | 20480         |
  | Low Latency            | Single-Node  | A3     | 16   | dp1 tp16 (no EP)| 20480        |
  | Long Context           | Multi-Node   | A3     | 32   | dp2 tp16       | 64000         |
  | High Throughput (250K) | PD 1×4P+1×4D | A2     | 32   | P: dp4 tp8, D: dp8 tp4 | 250000 |
  | High Throughput (1M)   | PD 1×4P+1×4D | A2     | 32   | P: dp4 tp8, D: dp4 tp8 | 1024000 |
  | PD Separation          | 1P1D         | A3     | 32   | P: dp2 tp16, D: dp8 tp4 | 135000 |

  ## Troubleshooting

  Refer to [Performance Tuning Guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) and [FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html).

  ## References

  - [vllm-ascend Documentation](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/GLM5.2.html)
  - [ModelScope GLM-5.2 BF16](https://www.modelscope.cn/models/ZhipuAI/GLM-5.2)
  - [ModelScope GLM-5.2 W8A8](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)

guide_zh: |
  ## 概述

  GLM-5.2 是智谱 AI (THUDM) 的混合专家 (MoE) 模型，拥有 753B 总参数，面向复杂系统工程和长周期智能体任务。支持最多 5 个投机 token 的 MTP 投机解码、异步调度、动态 EPLB 和 PD 分离部署。

  本文档基于 **vLLM-Ascend v0.22.1rc** 验证编写，所有 v0.22.1rc 及之后版本均可稳定运行。

  ## 环境准备

  - **硬件**:
    - W8A8: 1 × Atlas 800I A3 或 2 × Atlas 800I A2
    - BF16: 2 × Atlas 800I A3 或 4 × Atlas 800I A2
    - W4A8C8: 1 × Atlas 800I A3 或 1 × Atlas 800I A2
  - **模型权重**: [ModelScope BF16](https://www.modelscope.cn/models/ZhipuAI/GLM-5.2) / [ModelScope W8A8](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8)

  ### 环境搭建

  **Docker (推荐):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  ## 调优说明

  - 单节点低延迟场景推荐 `dp1 tp16` 并禁用 expert parallel。
  - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` 在长序列 (>=16k) 和低并发 (<=8) 时应禁用。
  - `VLLM_ASCEND_ENABLE_MLAPO=1` 是 W8A8 量化模型在 decode 端的必要配置。
  - 200k 上下文窗口推荐使用 co-located 4 节点 dp4 tp8 配置。

  ## 服务验证

  ```bash
  curl http://localhost:8000/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "glm-52",
          "prompt": "简单介绍一下大语言模型。",
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  ## 推荐配置

  | 场景             | 部署方式      | 设备 | NPU 数量 | 配置             | max-model-len |
  | ---------------- | ------------- | ---- | -------- | ---------------- | ------------- |
  | 高吞吐           | 单节点        | A3   | 16       | dp2 tp8          | 20480         |
  | 低延迟           | 单节点        | A3   | 16       | dp1 tp16 (无 EP) | 20480         |
  | 长上下文         | 多节点        | A3   | 32       | dp2 tp16         | 64000         |
  | 高吞吐 (250K)    | PD 1×4P+1×4D | A2   | 32       | P: dp4 tp8, D: dp8 tp4 | 250000 |
  | 高吞吐 (1M)      | PD 1×4P+1×4D | A2   | 32       | P: dp4 tp8, D: dp4 tp8 | 1024000 |

  ## 故障排除

  参考 [性能调优指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) 和 [常见问题](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

  ## 参考

  - [vllm-ascend 文档](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/GLM5.2.html)
  - [ModelScope GLM-5.2 BF16](https://www.modelscope.cn/models/ZhipuAI/GLM-5.2)
  - [ModelScope GLM-5.2 W8A8](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)
