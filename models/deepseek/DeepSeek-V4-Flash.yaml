meta:
  title: "DeepSeek-V4-Flash"
  slug: "deepseek-v4-flash"
  provider: "DeepSeek"
  description: "DeepSeek V4 MoE model with hybrid CSA+HCA attention, manifold-constrained hyper-connections, and three-tier reasoning (Non-think / Think High / Think Max)."
  title_zh: "DeepSeek-V4-Flash"
  description_zh: "DeepSeek V4 MoE 模型，采用混合 CSA+HCA 注意力机制、流形约束超连接和三级推理（非思考 / 深度思考 / 极致思考）。"
  date_added: 2026-07-07
  date_updated: 2026-08-03
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Compact 284B/13B V4 sibling — single-node 1M-context serving with W8A8 weights and MTP"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "deepseek-ai/DeepSeek-V4-Flash"
  min_vllm_version: "0.23.0rc1"
  architecture: moe
  parameter_count: "284B"
  active_parameters: "13B"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
    - "--tokenizer-mode"
    - "deepseek_v4"
    - "--tool-call-parser"
    - "deepseek_v4"
    - "--enable-auto-tool-choice"
    - "--reasoning-parser"
    - "deepseek_v4"
    - "--enable-expert-parallel"
    - "--safetensors-load-strategy"
    - "prefetch"
    - "--block-size"
    - "128"
    - "--quantization"
    - "ascend"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    HCCL_BUFFSIZE: "1024"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "10"
    TASK_QUEUE_ENABLE: "1"
    LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD"

features:
  mtp_spec_decoding:
    description: "Enable MTP (Multi-Token Prediction) speculative decoding with 1 token for accelerated inference."
    label: "MTP Spec Decoding"
    args:
      - "--speculative-config"
      - '{"num_speculative_tokens": 1, "method": "mtp", "enforce_eager": true}'
  flashcomm1:
    description: "Enable FlashComm communication optimization for inter-chip bandwidth."
    label: "FlashComm1"
    args: []
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  prefix_caching:
    description: "Enable automatic KV-cache prefix caching (--enable-prefix-caching or --no-enable-prefix-caching)."
    label: "Prefix Caching"
    args: []
  async_scheduling:
    description: "Enable asynchronous scheduling to overlap CPU scheduling with NPU computation."
    label: "Async Scheduling"
    args:
      - "--async-scheduling"
  cpu_binding:
    description: "Enable CPU core binding for reduced NUMA latencies."
    label: "CPU Binding"
    args:
      - "--additional-config"
      - '{"enable_cpu_binding": true}'
  multistream_overlap:
    description: "Enable multi-stream overlap for MoE shared expert computation."
    label: "Multi-stream Overlap"
    args:
      - "--additional-config"
      - '{"multistream_overlap_shared_expert": true}'
  npugraph_ex:
    description: "Enable NPUGraph EX for accelerated graph execution."
    label: "NPUGraph EX"
    args:
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}}'

opt_in_features:
  - mtp_spec_decoding
  - flashcomm1
  - prefix_caching
  - async_scheduling
  - cpu_binding
  - multistream_overlap
  - npugraph_ex

variants:
  default:
    precision: w8a8
    vram_minimum_gb: 148
    description: "W8A8 quantized weights on Atlas 800 A2/A3 (recommended)"
    extra_args:
      - "--quantization"
      - "ascend"
    extra_env: {}

compatible_strategies:
  - single_node_tp
  - multi_node_pd_disaggregation

hardware_overrides:
  ascend_a3:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_BUFFSIZE: "2560"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  ascend_a2:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_BUFFSIZE: "1024"

guide: |
  ## Overview

  DeepSeek-V4-Flash is a 284B-total / 13B-active MoE model in the V4 preview family. It pairs a **hybrid attention stack** — Compressed Sparse Attention (CSA) + Heavily Compressed Attention (HCA) — with **Manifold-Constrained Hyper-Connections (mHC)** to reach 27% of V3.2's per-token inference FLOPs and 10% of V3.2's KV cache at 1M context.

  First supported in vLLM-Ascend v0.23.0rc1. This guide is validated on **vLLM-Ascend v0.23.0rc1**. All v0.23.0rc1 and later versions can run stably.

  ## Prerequisites

  - **Hardware**: 1 Atlas 800 A3 (128G × 8) or 1 Atlas 800 A2 (64G × 8)
  - **Model weights**: [DeepSeek-V4-Flash-w8a8-mtp](https://www.modelscope.cn/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp) (W8A8 pre-quantized with MTP heads)

  ### Environment Setup

  **Docker (recommended):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  **Pip install:**
  ```bash
  git clone https://github.com/vllm-project/vllm.git
  cd vllm && pip install -e .
  git clone https://github.com/vllm-project/vllm-ascend.git
  cd vllm-ascend && pip install -e .
  ```

  ## Quantization

  DeepSeek-V4-Flash uses W8A8 mixed quantization: MoE expert weights are stored in W8A8 while the remaining (attention / norm / router) params stay in W8A8. Use the pre-quantized weight from Eco-Tech on ModelScope.

  ## Service Verification

  After starting the service, verify with:
  ```bash
  curl http://localhost:8900/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "dsv4",
          "messages": [{"role": "user", "content": "Who are you?"}],
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  ## Accuracy Results (Atlas 800 A3, W8A8)

  | Dataset | Metric   | Score  |
  | ------- | -------- | ------ |
  | GPQA    | accuracy | 88.17% |
  | GSM8K   | accuracy | 96.30% |

  ## Recommended Configurations

  | Scenario          | NPUs    | TP | DP | max-model-len | max-num-seqs | Notes |
  | ----------------- | ------- | -- | -- | ------------- | ------------ | ----- |
  | High Throughput   | 16 (A3) | 4  | 4  | 133120        | 32           | Single-node mixed |
  | Long Context (1M) | 8 (A3)  | 4  | 4  | 1048576       | 16           | dp4 tp4 single-node |
  | PD Separation     | 32 (A3) | -  | -  | 1048576       | 16 (P) / 60 (D) | 1P1D via Mooncake |

  ## Troubleshooting

  Refer to [Performance Tuning Guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) and [FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html).

  ## References

  - [vllm-ascend Documentation](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Flash.html)
  - [ModelScope (W8A8-MTP)](https://www.modelscope.cn/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp)
  - [PD Disaggregation Guide (Mooncake)](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)

guide_zh: |
  ## 概述

  DeepSeek-V4-Flash 是 V4 预览系列中 284B 总参 / 13B 激活的 MoE 模型。它结合了**混合注意力堆栈**（压缩稀疏注意力 CSA + 重度压缩注意力 HCA）与**流形约束超连接（mHC）**，在 1M 上下文下仅需 V3.2 27% 的每 token 推理 FLOPs 和 10% 的 KV 缓存。

  首次支持于 vLLM-Ascend v0.23.0rc1。本文档基于 **vLLM-Ascend v0.23.0rc1** 验证编写，所有 v0.23.0rc1 及之后版本均可稳定运行。

  ## 环境准备

  - **硬件**: 1 台 Atlas 800 A3 (128G × 8) 或 1 台 Atlas 800 A2 (64G × 8)
  - **模型权重**: [DeepSeek-V4-Flash-w8a8-mtp](https://www.modelscope.cn/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp)（W8A8 预量化，含 MTP 头）

  ### 环境搭建

  **Docker (推荐):**
  ```bash
  # A3
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}-a3
  # A2
  docker pull quay.io/ascend/vllm-ascend:{{ vllm_ascend_version }}
  ```

  **Pip 安装:**
  ```bash
  git clone https://github.com/vllm-project/vllm.git
  cd vllm && pip install -e .
  git clone https://github.com/vllm-project/vllm-ascend.git
  cd vllm-ascend && pip install -e .
  ```

  ## 量化方案

  DeepSeek-V4-Flash 使用 W8A8 混合量化：MoE 专家权重以 W8A8 存储，其余参数（注意力/归一化/路由器）保持 W8A8。使用 Eco-Tech 在 ModelScope 上发布的预量化权重。

  ## 服务验证

  ```bash
  curl http://localhost:8900/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "dsv4",
          "messages": [{"role": "user", "content": "你是谁？"}],
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  ## 精度结果 (Atlas 800 A3, W8A8)

  | 数据集 | 指标     | 得分   |
  | ------ | -------- | ------ |
  | GPQA   | accuracy | 88.17% |
  | GSM8K  | accuracy | 96.30% |

  ## 推荐配置

  | 场景       | NPU 数量 | TP | DP | max-model-len | max-num-seqs | 备注 |
  | ---------- | -------- | -- | -- | ------------- | ------------ | ---- |
  | 高吞吐     | 16 (A3)  | 4  | 4  | 133120        | 32           | 单节点混合 |
  | 长上下文 (1M) | 8 (A3) | 4  | 4  | 1048576       | 16           | dp4 tp4 单节点 |
  | PD 分离    | 32 (A3)  | -  | -  | 1048576       | 16 (P) / 60 (D) | 1P1D Mooncake |

  ## 故障排除

  参考 [性能调优指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) 和 [常见问题](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

  ## 参考

  - [vllm-ascend 文档](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Flash.html)
  - [ModelScope (W8A8-MTP)](https://www.modelscope.cn/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp)
  - [PD 分离部署指南 (Mooncake)](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)
  - [vllm-ascend GitHub](https://github.com/vllm-project/vllm-ascend)
